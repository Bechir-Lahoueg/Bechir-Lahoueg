name: 🌐 Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - name: 🌐 Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        with:
          # Forest / northern lights palette — matches the README theme
          SETTING_JSON: |
            {
              "username": "${{ github.repository_owner }}",
              "max_repos": 10,
              "type": "normal",
              "setting_file": "profile-3d-contrib/settings.json",
              "storage_dir": "profile-3d-contrib"
            }

      - name: 🌲 Commit & push 3D graph to main
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add profile-3d-contrib/
          git commit -m "chore: regenerate 3D contribution calendar [skip ci]" || echo "Nothing to commit"
          git push
